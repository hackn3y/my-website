<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff6b35;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff8c42;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>

  <!-- Grid pattern background -->
  <g opacity="0.1">
    <line x1="0" y1="105" x2="1200" y2="105" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="210" x2="1200" y2="210" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="315" x2="1200" y2="315" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="420" x2="1200" y2="420" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="525" x2="1200" y2="525" stroke="#fff" stroke-width="1"/>
    <line x1="200" y1="0" x2="200" y2="630" stroke="#fff" stroke-width="1"/>
    <line x1="400" y1="0" x2="400" y2="630" stroke="#fff" stroke-width="1"/>
    <line x1="600" y1="0" x2="600" y2="630" stroke="#fff" stroke-width="1"/>
    <line x1="800" y1="0" x2="800" y2="630" stroke="#fff" stroke-width="1"/>
    <line x1="1000" y1="0" x2="1000" y2="630" stroke="#fff" stroke-width="1"/>
  </g>

  <!-- Football icon -->
  <g transform="translate(150, 200)">
    <ellipse cx="0" cy="0" rx="80" ry="50" fill="url(#accentGradient)"/>
    <ellipse cx="0" cy="0" rx="60" ry="38" fill="none" stroke="#fff" stroke-width="3"/>
    <line x1="-60" y1="0" x2="60" y2="0" stroke="#fff" stroke-width="3"/>
    <line x1="-20" y1="-30" x2="-20" y2="30" stroke="#fff" stroke-width="3"/>
    <line x1="0" y1="-35" x2="0" y2="35" stroke="#fff" stroke-width="3"/>
    <line x1="20" y1="-30" x2="20" y2="30" stroke="#fff" stroke-width="3"/>
  </g>

  <!-- AI/ML Elements -->
  <g transform="translate(150, 380)">
    <!-- Neural network nodes -->
    <circle cx="0" cy="0" r="12" fill="#4ecca3" opacity="0.8"/>
    <circle cx="60" cy="-30" r="12" fill="#4ecca3" opacity="0.8"/>
    <circle cx="60" cy="30" r="12" fill="#4ecca3" opacity="0.8"/>
    <circle cx="120" cy="0" r="12" fill="#ff6b35" opacity="0.8"/>

    <!-- Connections -->
    <line x1="0" y1="0" x2="60" y2="-30" stroke="#4ecca3" stroke-width="2" opacity="0.4"/>
    <line x1="0" y1="0" x2="60" y2="30" stroke="#4ecca3" stroke-width="2" opacity="0.4"/>
    <line x1="60" y1="-30" x2="120" y2="0" stroke="#4ecca3" stroke-width="2" opacity="0.4"/>
    <line x1="60" y1="30" x2="120" y2="0" stroke="#4ecca3" stroke-width="2" opacity="0.4"/>
  </g>

  <!-- Main Title -->
  <text x="600" y="200" font-family="Arial, sans-serif" font-size="64" font-weight="bold" fill="#fff" text-anchor="middle">
    Building an NFL
  </text>
  <text x="600" y="270" font-family="Arial, sans-serif" font-size="64" font-weight="bold" fill="#fff" text-anchor="middle">
    Prediction Platform
  </text>

  <!-- Subtitle -->
  <text x="600" y="340" font-family="Arial, sans-serif" font-size="32" fill="#ff8c42" text-anchor="middle">
    Machine Learning + Gematria Analysis
  </text>

  <!-- Tech badges -->
  <g transform="translate(400, 420)">
    <rect x="0" y="0" width="100" height="40" rx="20" fill="#ff6b35" opacity="0.9"/>
    <text x="50" y="27" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#fff" text-anchor="middle">Python</text>
  </g>

  <g transform="translate(520, 420)">
    <rect x="0" y="0" width="120" height="40" rx="20" fill="#4ecca3" opacity="0.9"/>
    <text x="60" y="27" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#fff" text-anchor="middle">Node.js</text>
  </g>

  <g transform="translate(660, 420)">
    <rect x="0" y="0" width="140" height="40" rx="20" fill="#ff6b35" opacity="0.9"/>
    <text x="70" y="27" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#fff" text-anchor="middle">React Native</text>
  </g>

  <!-- Decorative elements -->
  <circle cx="1050" cy="150" r="60" fill="none" stroke="#ff6b35" stroke-width="3" opacity="0.3"/>
  <circle cx="1050" cy="150" r="80" fill="none" stroke="#ff6b35" stroke-width="2" opacity="0.2"/>

  <!-- Data visualization bars -->
  <g transform="translate(900, 400)" opacity="0.6">
    <rect x="0" y="80" width="40" height="100" fill="#4ecca3"/>
    <rect x="50" y="40" width="40" height="140" fill="#ff6b35"/>
    <rect x="100" y="60" width="40" height="120" fill="#4ecca3"/>
    <rect x="150" y="20" width="40" height="160" fill="#ff8c42"/>
  </g>
</svg>
