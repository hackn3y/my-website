<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1929;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a2332;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="chartGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4ade80;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#22c55e;stop-opacity:0.3" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff6b35;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff8c42;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>

  <!-- Grid Pattern -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.1"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Stock Chart Candlesticks (Background) -->
  <g opacity="0.15">
    <!-- Bullish candles -->
    <rect x="120" y="280" width="20" height="60" fill="#22c55e" rx="2"/>
    <line x1="130" y1="250" x2="130" y2="340" stroke="#22c55e" stroke-width="2"/>

    <rect x="180" y="240" width="20" height="80" fill="#22c55e" rx="2"/>
    <line x1="190" y1="210" x2="190" y2="320" stroke="#22c55e" stroke-width="2"/>

    <rect x="300" y="220" width="20" height="70" fill="#22c55e" rx="2"/>
    <line x1="310" y1="190" x2="310" y2="290" stroke="#22c55e" stroke-width="2"/>

    <!-- Bearish candles -->
    <rect x="240" y="260" width="20" height="50" fill="#ef4444" rx="2"/>
    <line x1="250" y1="240" x2="250" y2="310" stroke="#ef4444" stroke-width="2"/>

    <rect x="360" y="250" width="20" height="60" fill="#ef4444" rx="2"/>
    <line x1="370" y1="230" x2="370" y2="310" stroke="#ef4444" stroke-width="2"/>
  </g>

  <!-- Main Stock Chart -->
  <g>
    <!-- Chart Background -->
    <rect x="80" y="180" width="480" height="280" fill="#0f1f3a" rx="12" opacity="0.6"/>

    <!-- Chart Line (Upward Trend) -->
    <path d="M 100 400 Q 150 380, 200 350 T 300 300 T 400 260 T 500 220"
          stroke="url(#chartGradient)" stroke-width="4" fill="none"/>

    <!-- Area Fill -->
    <path d="M 100 400 Q 150 380, 200 350 T 300 300 T 400 260 T 500 220 L 500 440 L 100 440 Z"
          fill="url(#chartGradient)" opacity="0.3"/>

    <!-- Data Points -->
    <circle cx="100" cy="400" r="6" fill="#22c55e" opacity="0.8"/>
    <circle cx="200" cy="350" r="6" fill="#22c55e" opacity="0.8"/>
    <circle cx="300" cy="300" r="6" fill="#22c55e" opacity="0.8"/>
    <circle cx="400" cy="260" r="6" fill="#22c55e" opacity="0.8"/>
    <circle cx="500" cy="220" r="6" fill="#22c55e" opacity="0.8"/>

    <!-- Y-axis Labels -->
    <text x="60" y="240" fill="#ffffff" font-size="14" opacity="0.5">$180</text>
    <text x="60" y="320" fill="#ffffff" font-size="14" opacity="0.5">$160</text>
    <text x="60" y="400" fill="#ffffff" font-size="14" opacity="0.5">$140</text>

    <!-- Prediction Arrow -->
    <path d="M 520 220 L 600 180" stroke="#ff6b35" stroke-width="4" stroke-dasharray="8,4"/>
    <polygon points="600,180 590,175 592,186" fill="#ff6b35"/>

    <!-- Prediction Label -->
    <rect x="610" y="165" width="80" height="30" fill="#ff6b35" rx="15"/>
    <text x="650" y="185" text-anchor="middle" fill="white" font-size="16" font-weight="bold">UP ↑</text>
  </g>

  <!-- ML Brain Icon -->
  <g transform="translate(720, 200)">
    <!-- Brain Circle -->
    <circle cx="100" cy="100" r="90" fill="#1e3a5f" opacity="0.8"/>
    <circle cx="100" cy="100" r="90" fill="none" stroke="url(#accentGradient)" stroke-width="3"/>

    <!-- Neural Network Nodes -->
    <!-- Input Layer -->
    <circle cx="50" cy="60" r="8" fill="#ff6b35"/>
    <circle cx="50" cy="100" r="8" fill="#ff6b35"/>
    <circle cx="50" cy="140" r="8" fill="#ff6b35"/>

    <!-- Hidden Layer -->
    <circle cx="100" cy="50" r="8" fill="#ff8c42"/>
    <circle cx="100" cy="85" r="8" fill="#ff8c42"/>
    <circle cx="100" cy="115" r="8" fill="#ff8c42"/>
    <circle cx="100" cy="150" r="8" fill="#ff8c42"/>

    <!-- Output Layer -->
    <circle cx="150" cy="100" r="10" fill="#4ade80"/>

    <!-- Connections -->
    <line x1="50" y1="60" x2="100" y2="50" stroke="#ff6b35" stroke-width="1.5" opacity="0.4"/>
    <line x1="50" y1="60" x2="100" y2="85" stroke="#ff6b35" stroke-width="1.5" opacity="0.4"/>
    <line x1="50" y1="100" x2="100" y2="85" stroke="#ff6b35" stroke-width="1.5" opacity="0.4"/>
    <line x1="50" y1="100" x2="100" y2="115" stroke="#ff6b35" stroke-width="1.5" opacity="0.4"/>
    <line x1="50" y1="140" x2="100" y2="115" stroke="#ff6b35" stroke-width="1.5" opacity="0.4"/>
    <line x1="50" y1="140" x2="100" y2="150" stroke="#ff6b35" stroke-width="1.5" opacity="0.4"/>

    <line x1="100" y1="50" x2="150" y2="100" stroke="#ff8c42" stroke-width="2" opacity="0.5"/>
    <line x1="100" y1="85" x2="150" y2="100" stroke="#ff8c42" stroke-width="2" opacity="0.5"/>
    <line x1="100" y1="115" x2="150" y2="100" stroke="#ff8c42" stroke-width="2" opacity="0.5"/>
    <line x1="100" y1="150" x2="150" y2="100" stroke="#ff8c42" stroke-width="2" opacity="0.5"/>
  </g>

  <!-- Title Section -->
  <text x="600" y="480" text-anchor="middle" fill="white" font-size="56" font-weight="bold">
    Stocky
  </text>
  <text x="600" y="530" text-anchor="middle" fill="#ff6b35" font-size="32" font-weight="600">
    ML Stock Prediction Platform
  </text>

  <!-- Tech Badges -->
  <g transform="translate(200, 520)">
    <!-- React Badge -->
    <rect x="0" y="0" width="100" height="30" fill="#61dafb" rx="15" opacity="0.9"/>
    <text x="50" y="20" text-anchor="middle" fill="#000" font-size="14" font-weight="bold">React</text>

    <!-- Flask Badge -->
    <rect x="110" y="0" width="100" height="30" fill="#000000" rx="15" opacity="0.9"/>
    <text x="160" y="20" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">Flask</text>

    <!-- scikit-learn Badge -->
    <rect x="220" y="0" width="130" height="30" fill="#f89939" rx="15" opacity="0.9"/>
    <text x="285" y="20" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">scikit-learn</text>

    <!-- Python Badge -->
    <rect x="360" y="0" width="100" height="30" fill="#3776ab" rx="15" opacity="0.9"/>
    <text x="410" y="20" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">Python</text>

    <!-- Tailwind Badge -->
    <rect x="470" y="0" width="110" height="30" fill="#06b6d4" rx="15" opacity="0.9"/>
    <text x="525" y="20" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">Tailwind</text>
  </g>

  <!-- Decorative Elements -->
  <!-- Floating Particles -->
  <circle cx="950" cy="120" r="3" fill="#ff6b35" opacity="0.6"/>
  <circle cx="1050" cy="200" r="2" fill="#ff8c42" opacity="0.6"/>
  <circle cx="980" cy="380" r="3" fill="#4ade80" opacity="0.6"/>
  <circle cx="1100" cy="450" r="2" fill="#ff6b35" opacity="0.6"/>
  <circle cx="150" cy="80" r="2" fill="#ff8c42" opacity="0.6"/>
  <circle cx="250" cy="140" r="3" fill="#4ade80" opacity="0.6"/>

  <!-- Stats Box -->
  <g transform="translate(900, 330)">
    <rect x="0" y="0" width="250" height="100" fill="#0f1f3a" rx="10" opacity="0.7"/>
    <text x="20" y="30" fill="#4ade80" font-size="32" font-weight="bold">52%</text>
    <text x="20" y="50" fill="#b0b0b0" font-size="14">Prediction Accuracy</text>
    <text x="20" y="75" fill="#ff6b35" font-size="24" font-weight="bold">30+</text>
    <text x="20" y="92" fill="#b0b0b0" font-size="14">Technical Indicators</text>
  </g>
</svg>
